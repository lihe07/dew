[project]
name = "stardew-agent"
version = "1.0.0"
description = "An agent which plays Stardew Valley through the Stardew Bridge mod."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2,<3",
    "pillow>=10",
    "python-dotenv>=1",
    "rich>=15",
    "httpx>=0.27",
    "wasmtime>=51,<52",
]

[project.scripts]
stardew = "stardew_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stardew_agent"]
